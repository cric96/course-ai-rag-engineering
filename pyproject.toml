[project]
name = "ragcourse"
version = "0.1.0"
description = "Hands-on course: building, evaluating and optimizing a RAG pipeline"
readme = "README.md"
authors = [
    { name = "Gianluca Aguzzi", email = "gianluca.aguzzi@unibo.it" }
]
# Pinned to 3.12: widest wheel support for ML / OCR libraries.
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28.1",
    "pymupdf>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]
slides = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "quarto-cli>=1.11.9",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: downloads or runs local models (skipped in CI)",
    "llm: calls a remote LLM/API, needs credentials (skipped in CI)",
]

[tool.uv]
# Local `uv sync` installs everything; CI test job skips the heavy slides group.
default-groups = ["dev", "slides"]
