[project]
name = "ragcourse"
version = "0.1.0"
description = "Hands-on course: building, evaluating and optimizing a RAG pipeline"
readme = "README.md"
authors = [
    { name = "Gianluca Aguzzi", email = "gianluca.aguzzi@unibo.it" }
]
# Pinned to 3.12: widest wheel support for ML / OCR libraries.
requires-python = "==3.12.*"
dependencies = [
    "deepeval>=4.3.2",
    "httpx>=0.28.1",
    "langchain>=1.4.8",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "ranx>=0.3.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]
models = [
    "fastembed>=0.9.1",
    "sentence-transformers>=6.2.0",
]
slides = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "quarto-cli>=1.11.9",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DeepEval's pytest plugin is for `deepeval test run`: plain pytest does not need it.
addopts = "-ra --strict-markers -p no:deepeval"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: downloads or runs local models (skipped in CI)",
    "llm: calls a remote LLM/API, needs credentials (skipped in CI)",
]

[tool.uv]
# Local `uv sync` installs everything; CI skips the heavy groups it does not need.
default-groups = ["dev", "models", "slides"]
