project:
  type: default
  output-dir: _site

lang: it
date-format: "D MMMM YYYY"

filters:
  - source-links.lua  # source and implementation links for every slide
  - chapter-ids.lua  # chapter number in each slide address: #/03-...

execute:
  echo: true     # reveal.js hides code by default
  freeze: false  # freeze ignores the included chapters: jupyter-cache keeps renders fast
  warning: false

format:
  revealjs:
    theme: [default, theme.scss]
    width: 1280
    height: 720
    margin: 0  # title bars reach the screen edges, as in Metropolis
    slide-number: c/t
    hash: true
    transition: none
    syntax-highlighting: code.theme  # bold orange keywords, Metropolis palette
    code-line-numbers: false
    fig-format: svg  # sharp charts on any projector
    navigation-mode: linear  # arrows walk through sections and slides alike
    include-after-body: progress.html
