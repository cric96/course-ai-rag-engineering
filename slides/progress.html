<script>
  // Metropolis-style progress on section slides: the share of slides already shown.
  document.addEventListener("DOMContentLoaded", () => {
    const slides = [...document.querySelectorAll(".reveal .slides section.slide")];
    slides.forEach((slide, i) => {
      slide.style.setProperty("--progress", `${(100 * i) / (slides.length - 1)}%`);
    });

    // One footer shows the current slide's study links, in the canvas band theme.scss keeps free.
    // Each slide retains its own links in the HTML for printing and inspection.
    const title = document.getElementById("title-slide");
    const firstLinks = document.querySelector(".slide-code-links");
    if (title && firstLinks) {
      const links = document.createElement("div");
      links.className = "slide-code-links";
      const link = document.createElement("a");
      link.href = firstLinks.dataset.titleSource;
      link.textContent = "Sorgente slide";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      links.append(link);
      title.append(links);
    }
    const footer = document.createElement("nav");
    footer.className = "slide-code-footer";
    footer.setAttribute("aria-label", "Codice della slide");
    const canvas = document.querySelector(".reveal .slides");
    canvas.append(footer);  // scaled with the slide, so the band is the same on every screen
    const updateLinks = () => {
      const slide = Reveal.getCurrentSlide();
      const links = slide?.querySelector(":scope > .slide-code-links");
      footer.replaceChildren(...(links ? [...links.childNodes].map(node => node.cloneNode(true)) : []));
      footer.classList.toggle("on-dark", slide?.classList.contains("standout") || false);
    };
    Reveal.on("ready", updateLinks);
    Reveal.on("slidechanged", updateLinks);
    if (Reveal.isReady()) updateLinks();

    // Long slides: shrink the body (not the title bar) until it clears the footer band.
    const fit = (slide) => {
      if (!slide || slide.dataset.fit || !slide.offsetHeight) return;  // done, or not laid out yet
      const body = [...slide.children].filter((child) => !child.matches("h1, h2, .slide-code-links, aside"));
      const box = canvas.getBoundingClientRect();
      const band = parseFloat(getComputedStyle(slide).paddingBottom);  // $footer-band
      const limit = box.bottom - (band * box.height) / Reveal.getConfig().height;
      const bottom = () => Math.max(0, ...body.map((child) => child.getBoundingClientRect().bottom));
      let zoom = 1;
      while (bottom() > limit && zoom > 0.8) {
        zoom = Math.round(100 * zoom - 2) / 100;
        body.forEach((child) => { child.style.zoom = zoom; });
      }
      slide.dataset.fit = zoom;
      if (bottom() > limit) console.warn(`Slide too long even at ${zoom}:`, slide.id);
    };
    const startFitting = () => {
      Reveal.layout();  // stretched charts measured again with the web fonts loaded
      Reveal.getSlides().forEach(fit);  // slides not laid out yet are fitted when shown
      Reveal.on("slidechanged", (event) => fit(event.currentSlide));
    };
    document.fonts.ready.then(() => (Reveal.isReady() ? startFitting() : Reveal.on("ready", startFitting)));

    const walker = document.createTreeWalker(document.querySelector(".reveal .slides"), NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!/[→←✓]/.test(node.textContent) || parent.closest("script, style, svg, .sourceCode")) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const fragment = document.createDocumentFragment();
      node.textContent.split(/([→←✓])/).forEach((part) => {
        if (/[→←✓]/.test(part)) {
          const symbol = document.createElement("span");
          symbol.textContent = {"→": "⟶", "←": "⟵", "✓": "✓"}[part];
          symbol.style.color = "#eb811b";
          symbol.style.fontWeight = "bold";
          fragment.append(symbol);
        } else {
          fragment.append(document.createTextNode(part));
        }
      });
      node.replaceWith(fragment);
    });
  });
</script>
