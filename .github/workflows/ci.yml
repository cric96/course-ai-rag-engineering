name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # uv reads .python-version and installs Python 3.12.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Tests need neither Quarto (slides) nor PyTorch (models).
      - name: Install dependencies
        run: uv sync --locked --no-group slides --no-group models --no-group app

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      # Heavy (local models) and online (LLM APIs) tests run only locally.
      - name: Tests
        run: uv run pytest -m "not slow and not llm"

  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-group models --no-group app

      # Uses committed outputs in slides/_freeze/: no models or API keys needed.
      - name: Render slides
        run: uv run quarto render slides

      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: slides/_site
